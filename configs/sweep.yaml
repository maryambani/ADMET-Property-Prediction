program: scripts/train.py
method: bayes
metric:
  name: val_auc
  goal: maximize

parameters:
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  dropout:
    values: [0.1, 0.3, 0.5]
  batch_size:
    values: [32, 64, 128]
  hidden_dims:
    values:
      - [512, 256]
      - [1024, 512]
      - [256, 128]
  epochs:
    value: 20

command:
  - ${env}
  - python
  - ${program}
  - --wandb
